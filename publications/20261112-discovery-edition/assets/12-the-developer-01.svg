<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Give the buyer a way to check the answer</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Give the buyer a way to</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">check the answer</text><text x="72" y="488" font-family="Mona Sans" font-size="36" font-weight="600" fill="#162760">Distrust AI-tool accuracy</text><text x="844" y="488" font-family="Young Serif" font-size="48" font-weight="400" fill="#162760">46%</text><rect x="72" y="519" width="936" height="32" fill="#E5E8ED"/><rect x="72" y="519" width="430.56" height="32" fill="#162760"/><text x="72" y="673" font-family="Mona Sans" font-size="36" font-weight="600" fill="#162760">Trust AI-tool accuracy</text><text x="844" y="673" font-family="Young Serif" font-size="48" font-weight="400" fill="#162760">33%</text><rect x="72" y="704" width="936" height="32" fill="#E5E8ED"/><rect x="72" y="704" width="308.88" height="32" fill="#FBD387"/><text x="72" y="982" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Show the question and answer</text><text x="72" y="1058" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Link the evidence</text><text x="72" y="1134" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Name when a person must check</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Stack Overflow 2025 · accuracy question · 33,244 responses · not buyer data.</text></svg>