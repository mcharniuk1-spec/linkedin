<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What makes this message worth answering?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">What makes this message</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">worth answering?</text><rect x="79" y="459" width="936" height="389" rx="10" fill="#E5E8ED"/><rect x="72" y="450" width="936" height="389" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="108" y="513" font-family="Mona Sans" font-size="30" font-weight="400" fill="#676D7A">Illustrative message</text><text x="108" y="575" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">Hi Maya — I saw you’re hiring your</text><text x="108" y="627" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">first customer-success lead. Would a</text><text x="108" y="679" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">checklist for turning onboarding</text><text x="108" y="731" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">questions into founder posts be useful?</text><text x="72" y="944" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Checked context</text><path d="M72 964h285" stroke="#FBD387" stroke-width="10" stroke-linecap="round"/><text x="72" y="1023" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Relevant problem</text><path d="M72 1043h304" stroke="#FBD387" stroke-width="10" stroke-linecap="round"/><text x="72" y="1102" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">One useful next step</text><path d="M72 1122h380" stroke="#FBD387" stroke-width="10" stroke-linecap="round"/><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Use the hiring detail only when it is real and relevant.</text></svg>