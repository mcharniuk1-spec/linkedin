<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What should 45 minutes decide?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">What should 45 minutes</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">decide?</text><text x="72" y="468" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">0–10 min: business</text><text x="72" y="521.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Product, user and buying decision.</text><text x="72" y="613" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">10–19 min: buyer problem</text><text x="72" y="666.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">What needs to become clearer?</text><text x="72" y="758" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">19–27 min: one real example</text><text x="72" y="811.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Choice, alternative and consequence.</text><text x="72" y="903" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">27–39 min: working rhythm</text><text x="72" y="956.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Source material, review and cadence.</text><text x="72" y="1048" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">39–45 min: next step</text><text x="72" y="1101.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Read back the plan and missing inputs.</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Proposed agenda. Scope and frequency follow the actual conversation.</text></svg>