<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Start with what you already know</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Start with what you</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">already know</text><rect x="79" y="458" width="936" height="640" rx="10" fill="#E5E8ED"/><rect x="72" y="449" width="936" height="640" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="108" y="535" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Bring</text><text x="108" y="595.0" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">Product deck, existing posts and buyer</text><text x="108" y="645.7" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">questions.</text><text x="108" y="724" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Discuss</text><text x="108" y="784.0" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">Who is it for? What problem? What makes</text><text x="108" y="834.7" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">it different?</text><text x="108" y="913" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Leave with</text><text x="108" y="973.0" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">A buyer brief, voice guide and profile</text><text x="108" y="1023.7" font-family="Mona Sans" font-size="39" font-weight="400" fill="#162760">direction.</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">The founder supplies product truth and approves the point of view.</text></svg>