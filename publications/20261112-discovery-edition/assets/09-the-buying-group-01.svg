<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Who else has to understand the value?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Who else has to</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">understand the value?</text><text x="72" y="626" font-family="Young Serif" font-size="158" font-weight="400" fill="#162760">55%</text><text x="438" y="503" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">of US hidden decision-</text><text x="438" y="554" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">makers said thought</text><text x="438" y="605" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">leadership is one way</text><text x="438" y="656" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">they vet vendors.</text><text x="72" y="880" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">User</text><text x="390" y="880" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760">How does the task change?</text><text x="72" y="984" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Manager</text><text x="390" y="984" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760">What must the team adopt?</text><text x="72" y="1088" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Finance / risk</text><text x="390" y="1088" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760">What cost, evidence and responsibility?</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">2025 Edelman–LinkedIn survey, p.8. Self-reported US responses.</text></svg>