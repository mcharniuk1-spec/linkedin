<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Give one buyer question three useful angles</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Give one buyer question</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">three useful angles</text><text x="72" y="500" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Explain the decision</text><text x="72" y="561.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Why does this approach matter to the buyer?</text><path d="M72 634.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="725" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Show the work</text><text x="72" y="786.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">A worked example, walkthrough or comparison.</text><path d="M72 859.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="950" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Help someone choose</text><text x="72" y="1011.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">A checklist they can use in their own</text><text x="72" y="1060.4" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">situation.</text><path d="M72 1133.8h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Original writing and meaningful visuals; facts reviewed by the founder.</text></svg>