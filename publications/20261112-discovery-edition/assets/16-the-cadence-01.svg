<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Choose a rhythm you can support</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Choose a rhythm you can</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">support</text><text x="72" y="468" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Reader job</text><text x="72" y="521.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">What should someone understand or do?</text><text x="72" y="613" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Source material</text><text x="72" y="666.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Which distinct examples can we support?</text><text x="72" y="758" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Review capacity</text><text x="72" y="811.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Who checks facts and voice, and when?</text><text x="72" y="903" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Useful format</text><text x="72" y="956.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">Show, explain, compare or demonstrate?</text><text x="72" y="1048" font-family="Mona Sans" font-size="39" font-weight="600" fill="#162760">Review point</text><text x="72" y="1101.0" font-family="Mona Sans" font-size="35" font-weight="400" fill="#162760">What will make us continue or adjust?</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Agree a starting cadence on the call; test sustainability and buyer relevance.</text></svg>