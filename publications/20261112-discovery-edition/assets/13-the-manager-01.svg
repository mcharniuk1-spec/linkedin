<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What decision does this draft need?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">What decision does this</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">draft need?</text><text x="72" y="492" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Product truth</text><text x="72" y="553.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Does this match what we deliver?</text><path d="M72 626.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="686" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Founder voice</text><text x="72" y="747.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Is this the position and phrasing?</text><path d="M72 820.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="880" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Reader action</text><text x="72" y="941.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Is this a useful, agreed next step?</text><path d="M72 1014.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1117" font-family="Mona Sans" font-size="31" font-weight="400" fill="#676D7A">Example edit:</text><text x="72" y="1174.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">“Confirm the promised response time or remove</text><text x="72" y="1220.8" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">it.”</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Name the reviewer and the decision needed to finish the post.</text></svg>