<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Choose the question before the metric</title><desc>Three questions. Three different kinds of evidence. Did they understand? — reader check; Who saw it? — available analytics; Was there interest? — conversation context</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">Choose the question before</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">the metric</text><text x="72" y="550" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">Did they understand?</text><text x="72" y="609" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Ask a reader to explain the point back.</text><path d="M72 682H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="770" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">Who saw it?</text><text x="72" y="829" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Use available native analytics.</text><path d="M72 902H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="990" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">Was there interest?</text><text x="72" y="1049" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Read the actual conversation in context.</text><path d="M72 1122H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1240" font-size="27" font-family="Mona Sans" font-weight="400" fill="#162760">Each measure has limits. No sales result is assumed.</text></svg>