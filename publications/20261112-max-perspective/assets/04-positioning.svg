<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Specific can still be wrong</title><desc>Illustrative: “A support lead reviews unclear requests before a reply goes out.” Person: support lead; Task: review unclear requests; Check: does the product do this?</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">Specific can still be wrong</text><text x="72" y="540" font-size="31" font-family="Mona Sans" font-weight="400" fill="#162760">An illustrative sentence</text><rect x="72" y="638" width="266" height="8" fill="#FBD387"/><text x="72" y="624" font-size="44" font-family="Young Serif" font-weight="400" fill="#162760">A support lead</text><rect x="72" y="713" width="456" height="8" fill="#FBD387"/><text x="72" y="699" font-size="44" font-family="Young Serif" font-weight="400" fill="#162760">reviews unclear requests</text><rect x="72" y="788" width="456" height="8" fill="#FBD387"/><text x="72" y="774" font-size="44" font-family="Young Serif" font-weight="400" fill="#162760">before a reply goes out.</text><text x="72" y="935" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Person: who owns the work?</text><text x="72" y="1008" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Task: what do they actually do?</text><text x="72" y="1081" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Check: does the product work this way?</text></svg>