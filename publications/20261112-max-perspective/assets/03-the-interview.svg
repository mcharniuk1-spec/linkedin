<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Which decision was harder than it looks?</title><desc>A useful founder conversation starts with the choice. What mattered?; What else was possible?; What happened afterward?</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">Which decision was harder</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">than it looks?</text><text x="72" y="500" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">Goal. Constraint. Real alternative.</text><text x="72" y="560" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">Then ask what actually happened.</text><defs><clipPath id="scene"><rect x="72" y="690" width="936" height="470" rx="8"/></clipPath></defs><image x="72" y="690" width="936" height="624" preserveAspectRatio="xMidYMid slice" href="interview-context.png" clip-path="url(#scene)"/><text x="72" y="1202" font-size="25" font-family="Mona Sans" font-weight="400" fill="#162760">AI-generated context illustration; no real meeting depicted.</text></svg>