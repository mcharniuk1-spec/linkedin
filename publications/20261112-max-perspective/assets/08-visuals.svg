<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What does this image make clearer?</title><desc>Choose the form after you know its job. Compare a real choice; Annotate an example; Show useful context</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">What does this image make</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">clearer?</text><text x="72" y="535" font-size="30" font-family="Mona Sans" font-weight="400" fill="#162760">A vague visual label</text><text x="72" y="610" font-size="46" font-family="Young Serif" font-weight="400" fill="#162760">Observation limit</text><text x="72" y="726" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">What could the reader ask instead?</text><rect x="72" y="839" width="513" height="8" fill="#FBD387"/><text x="72" y="825" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">What did this example show?</text><rect x="72" y="924" width="494" height="8" fill="#FBD387"/><text x="72" y="910" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">Which case did we inspect?</text><rect x="72" y="1009" width="475" height="8" fill="#FBD387"/><text x="72" y="995" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">What still needs testing?</text><text x="72" y="1150" font-size="35" font-family="Mona Sans" font-weight="400" fill="#162760">Turn the label into a useful question.</text></svg>