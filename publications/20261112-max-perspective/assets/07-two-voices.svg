<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Make it clearer, and keep it mine</title><desc>Three questions for the author’s review. Is this what I mean?; Can I support the detail?; Would I say it this way?</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">Make it clearer, and keep</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">it mine</text><text x="72" y="570" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">I can ask for a complete rewrite.</text><text x="72" y="633" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">The position still has to be mine.</text><path d="M72 748H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="818" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Is this what I mean?</text><path d="M72 883H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="953" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Can I support the detail?</text><path d="M72 1018H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1088" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Would I say it this way?</text></svg>