<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What does the reader get?</title><desc>A clear question. One real decision. Something useful to take away. Reader question; Real decision; Useful consequence</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">What does the reader get?</text><text x="72" y="620" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">Before I edit the wording,</text><text x="72" y="679" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">I want the reader’s question.</text><path d="M72 768H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="829" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">What will they understand?</text><path d="M72 880H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="941" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">Which decision can they inspect?</text><path d="M72 992H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1053" font-size="38" font-family="Mona Sans" font-weight="400" fill="#162760">What can they use afterward?</text></svg>