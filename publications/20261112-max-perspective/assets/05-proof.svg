<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What can you rely on after the demo?</title><desc>One shown case earns specific questions. Inspect the example; Ask about difficult cases; Check the wider claim</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">What can you rely on after</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">the demo?</text><text x="72" y="570" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">What you can inspect</text><text x="72" y="629" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">One input, the result, the review step.</text><path d="M72 702H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="803" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">What to ask next</text><text x="72" y="862" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Unclear cases, failures and the</text><text x="72" y="911" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">conditions.</text><path d="M72 984H1008" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1036" font-size="43" font-family="Young Serif" font-weight="400" fill="#162760">What needs broader evidence</text><text x="72" y="1095" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Reliability, effort and repeatability.</text><path d="M72 1168H1008" stroke="#E5E8ED" stroke-width="2"/></svg>