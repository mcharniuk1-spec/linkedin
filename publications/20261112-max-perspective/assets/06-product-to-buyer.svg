<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Who does what next?</title><desc>Illustrative writing workflow: a founder flags a product detail; writer and designer update their versions; an owner checks consistency. Person; Action; Point of control</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">Who does what next?</text><text x="72" y="550" font-size="36" font-family="Mona Sans" font-weight="400" fill="#162760">The sentence has to name the handoff.</text><rect x="72" y="694" width="44" height="8" fill="#FBD387"/><text x="145" y="665" font-size="46" font-family="Young Serif" font-weight="400" fill="#162760">The founder</text><text x="145" y="730" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Flags an inaccurate product detail.</text><rect x="72" y="860" width="44" height="8" fill="#FBD387"/><text x="145" y="831" font-size="46" font-family="Young Serif" font-weight="400" fill="#162760">Writer and designer</text><text x="145" y="896" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Update the caption and visual.</text><rect x="72" y="1026" width="44" height="8" fill="#FBD387"/><text x="145" y="997" font-size="46" font-family="Young Serif" font-weight="400" fill="#162760">The final reviewer</text><text x="145" y="1062" font-size="34" font-family="Mona Sans" font-weight="400" fill="#162760">Checks that both versions agree.</text><text x="72" y="1190" font-size="28" font-family="Mona Sans" font-weight="400" fill="#162760">Use actual product details. This is a writing check.</text></svg>