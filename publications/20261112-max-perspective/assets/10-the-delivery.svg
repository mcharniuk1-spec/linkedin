<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>The founder should recognise their thinking</title><desc>A writing process we are applying to our own publications first. Product truth; Buyer question; Author review</desc><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="90" font-size="32" font-family="Young Serif" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="220" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">The founder should</text><text x="72" y="302" font-size="68" font-family="Young Serif" font-weight="400" fill="#162760">recognise their thinking</text><text x="72" y="560" font-size="46" font-family="Mona Sans" font-weight="400" fill="#162760">I want a founder to read the final</text><text x="72" y="624" font-size="46" font-family="Mona Sans" font-weight="400" fill="#162760">post and recognise their own</text><text x="72" y="688" font-size="46" font-family="Mona Sans" font-weight="400" fill="#162760">thinking in it.</text><rect x="72" y="943" width="610" height="8" fill="#FBD387"/><text x="72" y="928" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">Product truth.</text><text x="72" y="1003" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">A useful buyer question.</text><text x="72" y="1078" font-size="39" font-family="Mona Sans" font-weight="400" fill="#162760">A draft the author can stand behind.</text><text x="72" y="1207" font-size="37" font-family="Young Serif" font-weight="400" fill="#162760">Max Charniuk</text></svg>