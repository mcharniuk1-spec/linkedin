<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Someone read your post. What happens next?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Someone read your post.</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">What happens next?</text><circle cx="100" cy="479" r="27" fill="#162760"/><text x="91" y="493" font-family="Mona Sans" font-size="31" font-weight="600" fill="#FFFFFF">1</text><path d="M100 508V601" stroke="#E5E8ED" stroke-width="3"/><text x="151" y="493" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">Your knowledge</text><text x="151" y="545" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">Interview, product material and buyer</text><text x="151" y="588" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">questions.</text><circle cx="100" cy="637" r="27" fill="#162760"/><text x="91" y="651" font-family="Mona Sans" font-size="31" font-weight="600" fill="#FFFFFF">2</text><path d="M100 666V759" stroke="#E5E8ED" stroke-width="3"/><text x="151" y="651" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">A useful explanation</text><text x="151" y="703" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">A clear profile, posts and visual</text><text x="151" y="746" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">examples.</text><circle cx="100" cy="795" r="27" fill="#162760"/><text x="91" y="809" font-family="Mona Sans" font-size="31" font-weight="600" fill="#FFFFFF">3</text><path d="M100 824V917" stroke="#E5E8ED" stroke-width="3"/><text x="151" y="809" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">A relevant conversation</text><text x="151" y="861" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">One question, useful material and actual</text><text x="151" y="904" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">replies.</text><circle cx="100" cy="953" r="27" fill="#162760"/><text x="91" y="967" font-family="Mona Sans" font-size="31" font-weight="600" fill="#FFFFFF">4</text><text x="151" y="967" font-family="Mona Sans" font-size="43" font-weight="600" fill="#162760">An agreed next step</text><text x="151" y="1019" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">Qualification and a meeting brief when</text><text x="151" y="1062" font-family="Mona Sans" font-size="33" font-weight="400" fill="#162760">there is fit.</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Voice builds the content. Pipeline adds researched conversations.</text></svg>