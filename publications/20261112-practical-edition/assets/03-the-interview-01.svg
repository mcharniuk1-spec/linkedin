<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Bring four things out of the interview</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Bring four things out of</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">the interview</text><rect x="79" y="469" width="936" height="668" rx="10" fill="#E5E8ED"/><rect x="72" y="460" width="936" height="668" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="108" y="530" font-family="Mona Sans" font-size="40" font-weight="600" fill="#162760">The decision</text><text x="108" y="584.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">Why did you choose this route?</text><text x="108" y="678" font-family="Mona Sans" font-size="40" font-weight="600" fill="#162760">The buyer question</text><text x="108" y="732.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">What must they understand?</text><text x="108" y="826" font-family="Mona Sans" font-size="40" font-weight="600" fill="#162760">The usable example</text><text x="108" y="880.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">What can we show or explain?</text><text x="108" y="974" font-family="Mona Sans" font-size="40" font-weight="600" fill="#162760">Your position</text><text x="108" y="1028.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760">What would you recommend or challenge?</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Use this as the interview sheet, then review the factual details.</text></svg>