<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>“Send me details.” What do you send?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">“Send me details.” What</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">do you send?</text><text x="72" y="479" font-family="Mona Sans" font-size="30" font-weight="400" fill="#676D7A">Example incoming reply</text><text x="72" y="542" font-family="Young Serif" font-size="48" font-weight="600" fill="#162760">“Send me details.”</text><rect x="79" y="608" width="936" height="277" rx="10" fill="#E5E8ED"/><rect x="72" y="599" width="936" height="277" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="108" y="669" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760">Is the bigger problem finding ideas,</text><text x="108" y="725" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760">or turning your knowledge into posts</text><text x="108" y="781" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760">that sound like you?</text><text x="72" y="957" font-family="Mona Sans" font-size="35" font-weight="600" fill="#162760">1. Answer the request</text><text x="72" y="1023" font-family="Mona Sans" font-size="35" font-weight="600" fill="#162760">2. Ask what changes the recommendation</text><text x="72" y="1089" font-family="Mona Sans" font-size="35" font-weight="600" fill="#162760">3. Share the relevant example</text><text x="72" y="1155" font-family="Mona Sans" font-size="35" font-weight="600" fill="#162760">4. Agree the next step</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Record the actual reply and next action in the contact record.</text></svg>