<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Give every content pillar a buyer decision</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Give every content</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">pillar a buyer decision</text><text x="72" y="500" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Is the problem worth solving?</text><text x="72" y="561.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Post: find where invoice approvals get</text><text x="72" y="610.4" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">delayed.</text><path d="M72 683.8h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="726" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Is this approach right for us?</text><text x="72" y="787.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Post: compare manual and rule-based routing.</text><path d="M72 860.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="952" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Can we put it to work?</text><text x="72" y="1013.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Post: walk through one invoice to approval.</text><path d="M72 1086.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Illustrative invoice-approval product. Each post answers a different question.</text></svg>