<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Keep the conversation moving</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">Keep the conversation</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">moving</text><rect x="79" y="479" width="936" height="210" rx="10" fill="#E5E8ED"/><rect x="72" y="470" width="936" height="210" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="110" y="528" font-family="Mona Sans" font-size="30" font-weight="400" fill="#676D7A">Example buyer reply</text><text x="110" y="587" font-family="Young Serif" font-size="44" font-weight="400" fill="#162760">How would this work for our team?</text><rect x="79" y="733" width="936" height="268" rx="10" fill="#E5E8ED"/><rect x="72" y="724" width="936" height="268" rx="10" fill="#FFFFFF" stroke="#E5E8ED" stroke-width="2"/><text x="110" y="780" font-family="Mona Sans" font-size="30" font-weight="400" fill="#676D7A">A useful next question</text><text x="110" y="840" font-family="Young Serif" font-size="44" font-weight="400" fill="#162760">Which reporting task would you</text><text x="110" y="895" font-family="Young Serif" font-size="44" font-weight="400" fill="#162760">want to improve first?</text><text x="72" y="1108" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Clarify the problem. Share the right example.</text><text x="72" y="1163" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Agree whether a meeting is useful.</text><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Voice + Pipeline includes research, reply qualification and a sales brief.</text></svg>