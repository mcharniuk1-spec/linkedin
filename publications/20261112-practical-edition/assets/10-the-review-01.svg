<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>What will you change next week?</title><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="86" font-family="Young Serif" font-size="31" font-weight="400" fill="#162760">OutSpoken</text><text x="72" y="206" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">What will you change</text><text x="72" y="285" font-family="Young Serif" font-size="67" font-weight="400" fill="#162760">next week?</text><text x="72" y="487" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Publish</text><text x="72" y="548.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">Did the planned material go out?</text><path d="M72 621.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="652" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Understand</text><text x="72" y="713.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">What did relevant people ask?</text><path d="M72 786.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="817" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Progress</text><text x="72" y="878.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">What next step did they agree?</text><path d="M72 951.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="982" font-family="Mona Sans" font-size="45" font-weight="600" fill="#162760">Change</text><text x="72" y="1043.0" font-family="Mona Sans" font-size="38" font-weight="400" fill="#162760">What should we do differently?</text><path d="M72 1116.4h936" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1268" font-family="Mona Sans" font-size="27" font-weight="400" fill="#676D7A">Native analytics for distribution; actual replies and CRM notes for conversations.</text></svg>