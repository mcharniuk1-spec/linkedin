<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Keep the founder’s voice in the final draft — page 1</title><desc>Clarity should still sound like the founder. Edit for the reader while keeping the author&#x27;s actual position intact.. Is it what I believe?; Can I support the claim?; Would I say it to a buyer?</desc><style>@font-face{font-family:Young Serif;src:url(../../fonts/YoungSerif-Regular.ttf)}@font-face{font-family:"Mona Sans";src:url(../../fonts/mona-sans-latin-wght-normal.woff2);font-weight:100 900}*{shape-rendering:geometricPrecision}</style><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="190.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">Clarity should still sound</text><text x="72" y="274.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">like the founder</text><text x="72" y="408.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">Edit for the reader while keeping the</text><text x="72" y="462.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">author&#x27;s actual position intact.</text><text x="72" y="516.0" font-family="Mona Sans" font-size="30" font-weight="600" fill="#162760" text-anchor="start">Facts, stance and voice</text><path d="M72 529 L427.2 529" fill="none" stroke="#FBD387" stroke-width="5"/><circle cx="85" cy="751" r="9" fill="none" stroke="#162760" stroke-width="2"/><path d="M80 751 l4 4 7-9" fill="none" stroke="#162760" stroke-width="2"/><text x="112" y="760.0" font-family="Mona Sans" font-size="32" font-weight="400" fill="#162760" text-anchor="start">Is it what I believe?</text><circle cx="85" cy="809" r="9" fill="none" stroke="#162760" stroke-width="2"/><path d="M80 809 l4 4 7-9" fill="none" stroke="#162760" stroke-width="2"/><text x="112" y="818.0" font-family="Mona Sans" font-size="32" font-weight="400" fill="#162760" text-anchor="start">Can I support the claim?</text><circle cx="85" cy="867" r="9" fill="none" stroke="#162760" stroke-width="2"/><path d="M80 867 l4 4 7-9" fill="none" stroke="#162760" stroke-width="2"/><text x="112" y="876.0" font-family="Mona Sans" font-size="32" font-weight="400" fill="#162760" text-anchor="start">Would I say it to a buyer?</text><path d="M72 1250 L1008 1250" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1300.0" font-family="Young Serif" font-size="26" font-weight="400" fill="#162760" text-anchor="start">OutSpoken</text></svg>