<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Ask for the decision, not just the topic — page 2</title><desc>What was the team solving for?. Record the goal and the constraint that shaped the choice.. Goal; Constraint</desc><style>@font-face{font-family:Young Serif;src:url(../../fonts/YoungSerif-Regular.ttf)}@font-face{font-family:"Mona Sans";src:url(../../fonts/mona-sans-latin-wght-normal.woff2);font-weight:100 900}*{shape-rendering:geometricPrecision}</style><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="190.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">What was the team</text><text x="72" y="274.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">solving for?</text><text x="72" y="408.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">Record the goal and the constraint that</text><text x="72" y="462.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">shaped the choice.</text><text x="72" y="516.0" font-family="Mona Sans" font-size="30" font-weight="600" fill="#162760" text-anchor="start">Use details the founder confirms</text><path d="M72 529 L565.8 529" fill="none" stroke="#FBD387" stroke-width="5"/><text x="72.0" y="798.0" font-family="Mona Sans" font-size="34" font-weight="600" fill="#162760" text-anchor="start">Goal</text><path d="M72.0 938 L140.68 938" fill="none" stroke="#E5E8ED" stroke-width="5"/><text x="562.0" y="798.0" font-family="Mona Sans" font-size="34" font-weight="600" fill="#162760" text-anchor="start">Constraint</text><path d="M562.0 938 L749.0 938" fill="none" stroke="#E5E8ED" stroke-width="5"/><path d="M540.0 764 L540.0 914" fill="none" stroke="#E5E8ED" stroke-width="2"/><path d="M72 1250 L1008 1250" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1300.0" font-family="Young Serif"