<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Ask for the decision, not just the topic — page 4</title><desc>Separate choice from hindsight. Confirm what happened afterward; label today&#x27;s interpretation as reflection.. Choice; Observed outcome; Reflection</desc><style>@font-face{font-family:Young Serif;src:url(../../fonts/YoungSerif-Regular.ttf)}@font-face{font-family:"Mona Sans";src:url(../../fonts/mona-sans-latin-wght-normal.woff2);font-weight:100 900}*{shape-rendering:geometricPrecision}</style><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="190.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">Separate choice from</text><text x="72" y="274.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">hindsight</text><text x="72" y="408.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">Confirm what happened afterward; label</text><text x="72" y="462.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">today&#x27;s interpretation as reflection.</text><text x="72" y="516.0" font-family="Mona Sans" font-size="30" font-weight="600" fill="#162760" text-anchor="start">No invented certainty</text><path d="M72 529 L401.4 529" fill="none" stroke="#FBD387" stroke-width="5"/><circle cx="85" cy="751" r="9" fill="none" stroke="#162760" stroke-width="2"/><path d="M80 751 l4 4 7-9" fill="none" stroke="#162760" stroke-width="2"/><text x="112" y="760.0" font-family="Mona Sans" font-size="32" font-weight="400" fill="#162760" text-anchor="start">Choice</text><circle cx="85" cy="809" r="9" fill="none" stroke="#162760" stroke-width="2"/><path d="M80 809 l4 4 7-9" fill="none" stroke="#162760" stroke-width="2"/><text x="112" y="818.0" font-family="Mona Sans" font-size="32" font-weight="400" fill="#162760" text-anchor="start">Observed outcome</text