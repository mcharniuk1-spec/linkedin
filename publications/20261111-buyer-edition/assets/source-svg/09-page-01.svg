<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Choose a business question before choosing a metric — page 1</title><desc>A business question sets the measure. Reach, understanding and buyer interest are different questions.. Reach: use reach data; Understanding: check what readers took away; Interest: examine relevant conversations</desc><style>@font-face{font-family:Young Serif;src:url(../../fonts/YoungSerif-Regular.ttf)}@font-face{font-family:"Mona Sans";src:url(../../fonts/mona-sans-latin-wght-normal.woff2);font-weight:100 900}*{shape-rendering:geometricPrecision}</style><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="190.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">A business question sets</text><text x="72" y="274.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">the measure</text><text x="72" y="408.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">Reach, understanding and buyer interest</text><text x="72" y="462.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">are different questions.</text><text x="72" y="516.0" font-family="Mona Sans" font-size="30" font-weight="600" fill="#162760" text-anchor="start">Choose the decision first</text><path d="M72 529 L453.0 529" fill="none" stroke="#FBD387" stroke-width="5"/><text x="72" y="760.0" font-family="Mona Sans" font-size="25" font-weight="600" fill="#676D7A" text-anchor="start">01</text><text x="130" y="760.0" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760" text-anchor="start">Reach: use reach data</text><path d="M130 778 L130 810" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="826.0" font-family="Mona Sans" font-size="25" font-weight="600" fill="#676D7A" text-anchor="start">02</text><text x="130" y="826.0" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760" text-anchor="start">Understanding: check what readers took away</text><path d="M130 844 L130 876" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="892.0" font-family="Mona Sans" font-size="25" font-weight="600" fill="#676D7A" text-anchor="start">03</text><text x="130" y="892.0" font-family="Mona Sans" font-size="34" font-weight="400" fill="#162760" text-anchor="start">Interest: examine relevant conversations</text><path d="M72 1250 L1008 1250" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1300.0" font-family="Young Serif" font-size="26" font-weight="400" fill="#162760" text-anchor="start">OutSpoken</text></svg>