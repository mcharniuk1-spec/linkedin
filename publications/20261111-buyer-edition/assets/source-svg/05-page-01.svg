<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Show what a product demonstration proves — page 1</title><desc>A demo makes one interaction visible. Illustrative example: one request is classified and sent for human review.. Request; Result; Review</desc><style>@font-face{font-family:Young Serif;src:url(../../fonts/YoungSerif-Regular.ttf)}@font-face{font-family:"Mona Sans";src:url(../../fonts/mona-sans-latin-wght-normal.woff2);font-weight:100 900}*{shape-rendering:geometricPrecision}</style><rect width="1080" height="1350" fill="#FCFFFC"/><text x="72" y="190.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">A demo makes one</text><text x="72" y="274.0" font-family="Young Serif" font-size="74" font-weight="400" fill="#162760" text-anchor="start">interaction visible</text><text x="72" y="408.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">Illustrative example: one request is</text><text x="72" y="462.0" font-family="Mona Sans" font-size="42" font-weight="400" fill="#162760" text-anchor="start">classified and sent for human review.</text><text x="72" y="516.0" font-family="Mona Sans" font-size="30" font-weight="600" fill="#162760" text-anchor="start">One example, one observed interaction</text><path d="M72 529 L643.8 529" fill="none" stroke="#FBD387" stroke-width="5"/><path d="M72 760 L72 922" fill="none" stroke="#E5E8ED" stroke-width="6"/><text x="100" y="794.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760" text-anchor="start">Request</text><text x="100" y="851.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760" text-anchor="start">Result</text><text x="100" y="908.0" font-family="Mona Sans" font-size="36" font-weight="400" fill="#162760" text-anchor="start">Review</text><path d="M72 1250 L1008 1250" fill="none" stroke="#E5E8ED" stroke-width="2"/><text x="72" y="1300.0" font-family="Young Serif" font-size="26" font-weight="400" fill="#162760" text-anchor="start">OutSpoken</text></svg>