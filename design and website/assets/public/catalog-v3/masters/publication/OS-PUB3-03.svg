<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">The feature you chose not to build</title><desc id="desc">Original editable Outspoken founder_perspective. Illustrative work, not published client content.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827" stop-opacity=".82" /><stop offset="1" stop-color="#102B3E" stop-opacity=".2" /></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3157C8" stroke-width="2" /></marker></defs><style>@font-face{font-family:Archivo;src:url('../../../assets/identity/font-source/archivo/Archivo[wdth,wght].ttf')}@font-face{font-family:Inter;src:url('../../../assets/identity/font-source/inter/Inter[opsz,wght].ttf')}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBFBF7" /><rect x="0" y="0" width="1080" height="1228" rx="0" fill="#162760" /><text data-slot="text-0" x="72" y="108" font-family="Inter" font-size="28" font-weight="600" fill="#FFFFFF">FOUNDER PERSPECTIVE</text><path d="M72 146H1008" stroke="#65749C" stroke-width="2" /><text data-slot="text-1" x="72" y="298.0" font-family="Archivo" font-size="74" font-weight="700" fill="#FFFFFF">The feature you</text><text data-slot="text-2" x="72" y="380.88" font-family="Archivo" font-size="74" font-weight="700" fill="#FFFFFF">chose not to build</text><rect x="72" y="418" width="832" height="94" rx="0" fill="#D4DD67" /><text data-slot="text-3" x="88" y="488" font-family="Archivo" font-size="74" font-weight="700" fill="#162760">can be the point.</text><text data-slot="text-4" x="72" y="676" font-family="Inter" font-size="42" font-weight="400" fill="#FFFFFF">What did that decision protect</text><text data-slot="text-5" x="72" y="738" font-family="Inter" font-size="42" font-weight="400" fill="#FFFFFF">for the customer?</text><text data-slot="text-6" x="72" y="920" font-family="Inter" font-size="34" font-weight="400" fill="#FFFFFF">A product choice becomes useful content</text><text data-slot="text-7" x="72" y="972" font-family="Inter" font-size="34" font-weight="400" fill="#FFFFFF">when the buyer can see its consequence.</text><text data-slot="text-8" x="72" y="1136" font-family="Inter" font-size="25" font-weight="500" fill="#E0E5EC">EDITORIAL QUESTION · NOT A FOUNDER CLAIM</text><rect x="0" y="1228" width="1080" height="122" rx="0" fill="#FBFBF7" /><path d="M72 1228H1008" stroke="#D7DCE2" stroke-width="2" /><text data-slot="text-9" x="72" y="1281" font-family="Archivo" font-size="39" font-weight="720" fill="#162760" letter-spacing="-.4">OUT</text><text data-slot="text-10" x="156.961" y="1281" font-family="Archivo" font-size="39" font-weight="720" fill="#A9AFBA" letter-spacing="-.4">SPOKEN</text><text data-slot="text-11" x="1008" y="1281" font-family="Inter" font-size="28" font-weight="500" fill="#162760" text-anchor="end">OS-T303</text><text data-slot="text-12" x="72" y="1320" font-family="Inter" font-size="27" font-weight="400" fill="#162760">Illustrative work — not published client content</text></svg>