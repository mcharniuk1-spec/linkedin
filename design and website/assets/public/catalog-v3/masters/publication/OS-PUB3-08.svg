<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Start the launch with the customer</title><desc id="desc">Original editable Outspoken company_launch. Illustrative work, not published client content.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827" stop-opacity=".82" /><stop offset="1" stop-color="#102B3E" stop-opacity=".2" /></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3157C8" stroke-width="2" /></marker></defs><style>@font-face{font-family:Archivo;src:url('../../../assets/identity/font-source/archivo/Archivo[wdth,wght].ttf')}@font-face{font-family:Inter;src:url('../../../assets/identity/font-source/inter/Inter[opsz,wght].ttf')}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBFBF7" /><image href="../../../assets/revisions/v3/nature/02-resonance-field.webp" x="0" y="0" width="1080" height="555" preserveAspectRatio="xMidYMid slice" /><rect x="0" y="0" width="1080" height="555" rx="0" fill="url(#shade)" /><text data-slot="text-0" x="72" y="108" font-family="Inter" font-size="27" font-weight="600" fill="#FFFFFF">COMPANY LAUNCH · CONTENT PROMPT</text><text data-slot="text-1" x="72" y="282.0" font-family="Archivo" font-size="72" font-weight="700" fill="#FFFFFF">What changed</text><text data-slot="text-2" x="72" y="362.64" font-family="Archivo" font-size="72" font-weight="700" fill="#FFFFFF">for the customer?</text><text data-slot="text-3" x="72" y="658" font-family="Inter" font-size="45" font-weight="600" fill="#162760">Start the announcement there.</text><rect x="72" y="704" width="606" height="14" rx="0" fill="#D4DD67" /><text data-slot="text-4" x="72" y="818" font-family="Inter" font-size="38" font-weight="400" fill="#162760">Then explain the capability.</text><text data-slot="text-5" x="72" y="882" font-family="Inter" font-size="38" font-weight="400" fill="#162760">Show the evidence you have.</text><text data-slot="text-6" x="72" y="946" font-family="Inter" font-size="38" font-weight="400" fill="#162760">Name the conditions that matter.</text><text data-slot="text-7" x="72" y="1100" font-family="Inter" font-size="29" font-weight="400" fill="#162760">No fictional release, customer</text><text data-slot="text-8" x="72" y="1143" font-family="Inter" font-size="29" font-weight="400" fill="#162760">or shipped feature is implied.</text><rect x="0" y="1228" width="1080" height="122" rx="0" fill="#FBFBF7" /><path d="M72 1228H1008" stroke="#D7DCE2" stroke-width="2" /><text data-slot="text-9" x="72" y="1281" font-family="Archivo" font-size="39" font-weight="720" fill="#162760" letter-spacing="-.4">OUT</text><text data-slot="text-10" x="156.961" y="1281" font-family="Archivo" font-size="39" font-weight="720" fill="#A9AFBA" letter-spacing="-.4">SPOKEN</text><text data-slot="text-11" x="1008" y="1281" font-family="Inter" font-size="28" font-weight="500" fill="#162760" text-anchor="end">OS-T308</text><text data-slot="text-12" x="72" y="1320" font-family="Inter" font-size="27" font-weight="400" fill="#162760">Illustrative work — not published client content</text></svg>