<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Make the basis of the claim visible</title><desc id="desc">Original editable Outspoken evidence_note. Illustrative work, not published client content.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827" stop-opacity=".82"/><stop offset="1" stop-color="#102B3E" stop-opacity=".2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3157C8" stroke-width="2"/></marker></defs><style>@font-face{font-family:Archivo;src:url('../../../assets/identity/font-source/archivo/Archivo[wdth,wght].ttf')}@font-face{font-family:Inter;src:url('../../../assets/identity/font-source/inter/Inter[opsz,wght].ttf')}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBFBF7"/><text x="72" y="108" font-family="Inter" font-size="28" font-weight="600" fill="#162760">EVIDENCE NOTE</text><text x="72" y="246.0" font-family="Archivo" font-size="68" font-weight="700" fill="#162760">Make the basis</text><text x="72" y="322.16" font-family="Archivo" font-size="68" font-weight="700" fill="#162760">of the claim visible.</text><rect x="72" y="398" width="600" height="14" rx="0" fill="#D4DD67"/><text x="72" y="514" font-family="Inter" font-size="26" font-weight="600" fill="#162760">SOURCE</text><text x="72" y="566" font-family="Inter" font-size="34" font-weight="400" fill="#162760">Where did this information come from?</text><path d="M72 598H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="651" font-family="Inter" font-size="26" font-weight="600" fill="#162760">OBSERVATION</text><text x="72" y="703" font-family="Inter" font-size="34" font-weight="400" fill="#162760">What was actually seen or recorded?</text><path d="M72 735H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="788" font-family="Inter" font-size="26" font-weight="600" fill="#162760">INTERPRETATION</text><text x="72" y="840" font-family="Inter" font-size="34" font-weight="400" fill="#162760">What might it mean for the buyer?</text><path d="M72 872H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="925" font-family="Inter" font-size="26" font-weight="600" fill="#162760">LIMIT</text><text x="72" y="977" font-family="Inter" font-size="34" font-weight="400" fill="#162760">What does the evidence not establish?</text><path d="M72 1009H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="1062" font-family="Inter" font-size="26" font-weight="600" fill="#162760">NEXT TEST</text><text x="72" y="1114" font-family="Inter" font-size="34" font-weight="400" fill="#162760">What would change the decision?</text><path d="M72 1146H1008" stroke="#D7DCE2" stroke-width="2"/><rect x="0" y="1228" width="1080" height="122" rx="0" fill="#FBFBF7"/><path d="M72 1228H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="1281" font-family="Archivo" font-size="39" font-weight="700" fill="#162760">OUT</text><text x="157.109" y="1281" font-family="Archivo" font-size="39" font-weight="700" fill="#9FA9B8">SPOKEN</text><text x="1008" y="1281" font-family="Inter" font-size="28" font-weight="500" fill="#162760" text-anchor="end">OS-T309</text><text x="72" y="1320" font-family="Inter" font-size="27" font-weight="400" fill="#162760">Illustrative work — not published client content</text></svg>