<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Before the opening line</title><desc id="desc">Original editable Outspoken professional_text. Illustrative work, not published client content.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827" stop-opacity=".82" /><stop offset="1" stop-color="#102B3E" stop-opacity=".2" /></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3157C8" stroke-width="2" /></marker></defs><style>@font-face{font-family:Archivo;src:url('../../../assets/identity/font-source/archivo/Archivo[wdth,wght].ttf')}@font-face{font-family:Inter;src:url('../../../assets/identity/font-source/inter/Inter[opsz,wght].ttf')}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBFBF7" /><text data-slot="text-0" x="72" y="108" font-family="Inter" font-size="28" font-weight="600" fill="#162760">PROFESSIONAL CONTENT</text><path d="M72 144H1008" stroke="#D7DCE2" stroke-width="2" /><text data-slot="text-1" x="72" y="280.0" font-family="Archivo" font-size="76" font-weight="700" fill="#162760">Clear writing starts</text><text data-slot="text-2" x="72" y="365.12" font-family="Archivo" font-size="76" font-weight="700" fill="#162760">with a clear</text><rect x="68" y="416" width="428" height="100" rx="0" fill="#D4DD67" /><text data-slot="text-3" x="80" y="494" font-family="Archivo" font-size="82" font-weight="700" fill="#162760">decision.</text><text data-slot="text-4" x="72" y="655" font-family="Inter" font-size="39" font-weight="400" fill="#162760">Who is this for?</text><text data-slot="text-5" x="72" y="719" font-family="Inter" font-size="39" font-weight="400" fill="#162760">What do they need to understand?</text><text data-slot="text-6" x="72" y="783" font-family="Inter" font-size="39" font-weight="400" fill="#162760