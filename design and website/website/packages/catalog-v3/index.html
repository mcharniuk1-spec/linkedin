<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outspoken V3 component atlas</title><style>body{font:16px Inter,Arial;color:#162760;background:#f6f6f1;margin:36px}h1{font-size:36px}nav{display:flex;gap:12px;flex-wrap:wrap}a{color:inherit}section{margin:64px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}object{width:100%;height:360px;background:white;object-fit:contain}.meta{font-size:13px;line-height:1.5}h3{margin-bottom:6px}</style><h1>Outspoken · editable component atlas</h1><p>11 layouts in each of8 categories.88 nativeSVG surfaces. Design specimens,not customer evidence. M2Lab informed practical breadth and signage only.</p><nav></nav><main></main><script>fetch('manifest.json').then(r=>r.json()).then(m=>{for(let c of m.expected_categories){let a=document.createElement('a');a.href='#'+c;a.textContent=c;document.querySelector('nav').append(a);let s=document.createElement('section');s.id=c;s.innerHTML='<h2>'+c+'</h2><div class="grid"></div>';for(let e of m.entries.filter(e=>e.category===c)){let art=document.createElement('article');art.innerHTML='<object type="image/svg+xml" data="'+e.source+'"></object><h3>'+e.id+' · '+e.layout+'</h3><p class="meta">'+e.use_when+'</p><a href="'+e.source+'">Open nativeSVG master</a>';s.querySelector('.grid').append(art)}document.querySelector('main').append(s)}})</script></html>
