<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">A draft is not an approved post</title><desc id="desc">Original editable Outspoken interface_walkthrough. Illustrative work, not published client content.</desc><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081827" stop-opacity=".82"/><stop offset="1" stop-color="#102B3E" stop-opacity=".2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#3157C8" stroke-width="2"/></marker></defs><style>@font-face{font-family:Archivo;src:url('../../../assets/identity/font-source/archivo/Archivo[wdth,wght].ttf')}@font-face{font-family:Inter;src:url('../../../assets/identity/font-source/inter/Inter[opsz,wght].ttf')}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBFBF7"/><text x="72" y="108" font-family="Inter" font-size="28" font-weight="600" fill="#162760">INTERFACE WALKTHROUGH</text><text x="72" y="252.0" font-family="Archivo" font-size="70" font-weight="700" fill="#162760">A draft is not</text><text x="72" y="330.4" font-family="Archivo" font-size="70" font-weight="700" fill="#162760">an approved post.</text><text x="72" y="444" font-family="Inter" font-size="35" font-weight="400" fill="#162760">Make the decision visible in the workflow.</text><g transform="translate(100 515) rotate(-4 440 255)"><rect x="0" y="0" width="880" height="485" rx="12" fill="#FFFFFF" stroke="#ABB4C2" stroke-width="2"/><rect x="0" y="0" width="880" height="60" rx="12" fill="#E9EDF2"/><text x="28" y="41" font-family="Inter" font-size="26" font-weight="500" fill="#162760">Content review · original interface specimen</text><text x="36" y="128" font-family="Inter" font-size="25" font-weight="600" fill="#162760">PRODUCT DECISION</text><text x="36" y="193" font-family="Inter" font-size="35" font-weight="600" fill="#162760">Explain the constraint before the claim.</text><path d="M36 232H844" stroke="#D7DCE2" stroke-width="2"/><text x="36" y="295" font-family="Inter" font-size="29" font-weight="600" fill="#162760">Source note</text><text x="36" y="345" font-family="Inter" font-size="28" font-weight="400" fill="#162760">A permissioned interview or evidence record.</text><rect x="36" y="398" width="222" height="46" rx="0" fill="#D4DD67"/><text x="50" y="431" font-family="Inter" font-size="26" font-weight="600" fill="#162760">Needs review</text><text x="284" y="432" font-family="Inter" font-size="26" font-weight="500" fill="#162760">→ Founder approval → Ready to publish</text></g><path d="M850 986V1090H72" fill="none" stroke="#3157C8" stroke-width="3" marker-end="url(#arrow)"/><text x="72" y="1154" font-family="Inter" font-size="32" font-weight="500" fill="#162760">The person responsible keeps the final say.</text><rect x="0" y="1228" width="1080" height="122" rx="0" fill="#FBFBF7"/><path d="M72 1228H1008" stroke="#D7DCE2" stroke-width="2"/><text x="72" y="1281" font-family="Archivo" font-size="39" font-weight="700" fill="#162760">OUT</text><text x="157.109" y="1281" font-family="Archivo" font-size="39" font-weight="700" fill="#9FA9B8">SPOKEN</text><text x="1008" y="1281" font-family="Inter" font-size="28" font-weight="500" fill="#162760" text-anchor="end">OS-T305</text><text x="72" y="1320" font-family="Inter" font-size="27" font-weight="400" fill="#162760">Illustrative work — not published client content</text></svg>