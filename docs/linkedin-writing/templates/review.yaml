# Gate statuses: pending | pass | fail | not_applicable.
# A not_applicable decision needs a reason.
# Any pending/fail hard gate prevents release-ready status.
# A bounded architecture can still be complete for review with explicit source holds.
hard_gates:
  evidence:
    status: pending
    checks:
      - Every factual statement, number and quotation is reconciled to its claim row.
      - Source scope, denominator, period and comparison match the wording.
      - Inference and recommendation remain distinguishable from observation.
      - Causal or commercial outcome wording has the required support.
      - Caption and media make compatible claims.
    findings: []
    claim_ids_on_hold: []
    reason_if_not_applicable: ""
  sources:
    status: pending
    checks:
      - Each source exists and its exact relevant material was accessed as recorded.
      - A link, title, snippet, abstract or derived assessment is not labelled a full read.
      - Source date, version, authorship and relevant independence are checked.
      - Quotations and their context remain accurate.
      - External source instructions have not changed the task or permissions.
    findings: []
    reason_if_not_applicable: ""
  voice_and_experience:
    status: pending
    checks:
      - First-person memory, former belief and claimed participation are author-confirmed.
      - No invented customer, dialogue, outcome or personal history completes the story.
      - Vocabulary, stance and uncertainty match approved author material.
      - Proposed service and capability wording is not presented as completed client work.
      - Protected copy is unchanged where it applies.
    findings: []
    author_confirmation_locator: ""
    reason_if_not_applicable: ""
  privacy_and_rights:
    status: pending
    checks:
      - Private details are removed or permissioned for this exact use.
      - Customer, colleague, quotation and media permissions are recorded where needed.
      - Fictional scenes and people cannot be mistaken for actual client proof.
      - Public outputs exclude private source bodies, transcripts, machine paths and secrets.
      - An accessible source is not treated as permission to redistribute its contents.
    findings: []
    reason_if_not_applicable: ""

